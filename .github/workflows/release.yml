name: Release

# On every push to main, semantic-release picks the next version from the commit messages,
# tags it and opens a draft GitHub release; the executables are then built, attached, and the
# release is published. A push with no feat/fix/breaking commits releases nothing.
on:
  push:
    branches: [main]

concurrency:
  group: release
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  version:
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.tag.outputs.tag }}
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v7.1.0
        with:
          node-version: 24
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
      - run: bun install --frozen-lockfile
      - run: bunx semantic-release
        env:
          GITHUB_TOKEN: ${{ github.token }}
      - id: tag
        run: echo "tag=$(git tag --points-at HEAD 'v*' | head -1)" >> "$GITHUB_OUTPUT"

  build:
    needs: version
    if: needs.version.outputs.tag != ''
    strategy:
      fail-fast: true
      matrix:
        include:
          - { os: macos-latest, target: darwin-arm64, native: true }
          - { os: macos-latest, target: darwin-x64, native: false }
          - { os: ubuntu-latest, target: linux-x64, native: true }
          - { os: ubuntu-latest, target: linux-arm64, native: false }
    runs-on: ${{ matrix.os }}
    env:
      TAG: ${{ needs.version.outputs.tag }}
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          ref: ${{ env.TAG }}
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
      - run: bun install --frozen-lockfile
      - name: Stamp the version from the tag
        run: bun -e 'const p=await Bun.file("package.json").json(); p.version=process.env.TAG.replace(/^v/,""); await Bun.write("package.json", JSON.stringify(p,null,2)+"\n")'
      - run: bun scripts/build-cli.ts --target bun-${{ matrix.target }}
      - name: Sign (macOS)
        if: runner.os == 'macOS'
        run: codesign --force --sign - release/bmad-board-${{ matrix.target }}
      - name: Smoke test
        if: matrix.native
        run: |
          bin=release/bmad-board-${{ matrix.target }}
          test "$($bin --version)" = "${TAG#v}"
          mkdir -p /tmp/proj/_bmad && cd /tmp/proj
          "$GITHUB_WORKSPACE/$bin" --no-open --port 34999 & pid=$!
          for i in $(seq 1 30); do curl -sf http://127.0.0.1:34999/api/info && break; sleep 0.5; done
          curl -sf http://127.0.0.1:34999/ | grep -q '<div id="root">'
          kill $pid
      - name: Package
        run: |
          cd release
          cp bmad-board-${{ matrix.target }} bmad-board
          tar -czf bmad-board-${{ matrix.target }}.tar.gz bmad-board
      - uses: actions/upload-artifact@v7.0.2
        with:
          name: bmad-board-${{ matrix.target }}
          path: release/bmad-board-${{ matrix.target }}.tar.gz

  publish:
    needs: [version, build]
    runs-on: ubuntu-latest
    env:
      TAG: ${{ needs.version.outputs.tag }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/download-artifact@v8.0.2
        with:
          path: dist
          merge-multiple: true
      - run: cd dist && sha256sum *.tar.gz > checksums.txt && cat checksums.txt
      - name: Attach executables and publish
        run: |
          gh release upload "$TAG" -R "$GITHUB_REPOSITORY" --clobber dist/*.tar.gz dist/checksums.txt
          gh release edit "$TAG" -R "$GITHUB_REPOSITORY" --draft=false --latest
